name: Alpicturia web foundation
on:
  pull_request:
    paths: ['web/**', 'compose.yaml', '.github/workflows/alpicturia-web.yml']
  push:
    paths: ['web/**', 'compose.yaml', '.github/workflows/alpicturia-web.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r web/requirements.txt
      - run: PYTHONPATH=web python -m unittest discover -s web/tests -v
      - run: node --check web/alpicturia/static/app.js && node --check web/alpicturia/static/sw.js
      - run: python -m compileall -q web/alpicturia
