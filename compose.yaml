services:
  api:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file: .env
    environment:
      ALPICTURIA_DATA: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - alpicturia-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: .
      dockerfile: web/Dockerfile
    command: ["python", "-m", "alpicturia.worker"]
    env_file: .env
    environment:
      ALPICTURIA_DATA: /data
    volumes:
      - alpicturia-data:/data
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
volumes:
  alpicturia-data:
